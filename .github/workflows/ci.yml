name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v7
        with:
          repository: recite/softverse
          ref: 38fdba9b255127b896ab68bf37871b92e729fd0c
          path: softverse-source
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . --group dev
      - run: make check
        env:
          SOFTVERSE_ROOT: ${{ github.workspace }}/softverse-source
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
  r-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          working-directory: tools/r-analysis
      - run: npm ci --prefix tools/r-analysis --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - run: Rscript --vanilla -e 'install.packages("renv", repos="https://cloud.r-project.org")'
      - run: Rscript --vanilla -e 'renv::restore(lockfile="tools/r-analysis/renv.lock", library="tools/r-analysis/library", prompt=FALSE)'
      - run: make check-r
