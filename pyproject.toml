[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "not-to-code"
version = "0.1.0"
description = "A descriptive engineering-quality profile of deposited research code"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Gaurav Sood"}]
keywords = ["research", "static-analysis", "duplication", "code-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pyarrow>=18", "tree-sitter>=0.25,<0.26",
  "tree-sitter-language-pack==1.14.3",
  "charset-normalizer>=3.4",
]

[project.urls]
Repository = "https://github.com/recite/not_to_code"
Issues = "https://github.com/recite/not_to_code/issues"

[project.scripts]
not-to-code = "not_to_code.cli:main"

[dependency-groups]
dev = ["pytest>=8", "black>=25", "isort>=6", "flake8>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.hatch.build.targets.wheel]
packages = ["src/not_to_code"]

[tool.hatch.build.targets.wheel.force-include]
"measurement.md" = "not_to_code/measurement.md"
